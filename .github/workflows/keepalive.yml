name: keepalive

# Keeps the Railway free-tier deployment awake by hitting /healthz
# every 5 minutes (Railway sleeps instances after inactivity).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://nova-store-production-2364.up.railway.app/healthz