# Render Blueprint — Nova store (Node backend + static storefront/admin)
# Deploy: in your Render dashboard: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: nova-store
    runtime: node
    plan: free
    rootDir: /
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Set this yourself in the Render dashboard (secret) to your Supabase pooler URL,
      # e.g. postgresql://postgres.<ref>:<password>@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false